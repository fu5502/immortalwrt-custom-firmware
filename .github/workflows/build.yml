name: Build custom ImmortalWrt firmware

on:
  workflow_dispatch:
    inputs:
      release:
        description: ImmortalWrt release version, or latest
        required: true
        default: latest
      rootfs_partsize:
        description: Root filesystem partition size in MB
        required: true
        default: "4096"
      imagebuilder_url:
        description: Optional custom ImageBuilder URL
        required: false
        default: ""
      upstream_packages:
        description: Refresh upstream plugin packages from configured release assets and SDK feeds
        required: true
        default: "1"
  push:
    branches:
      - main
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ github.event.inputs.release || 'latest' }}
      ROOTFS_PARTSIZE: ${{ github.event.inputs.rootfs_partsize || '4096' }}
      IMAGEBUILDER_URL: ${{ github.event.inputs.imagebuilder_url || '' }}
      BUILD_UPSTREAM_PACKAGES: ${{ github.event.inputs.upstream_packages || '1' }}
      TARGET_PATH: x86/64
      PROFILE: generic

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools rsync unzip \
            zlib1g-dev file wget xz-utils zstd curl ca-certificates qemu-utils

      - name: Build firmware
        run: bash scripts/build-imagebuilder.sh

      - name: Prepare release metadata
        run: |
          short_sha="$(printf '%.7s' "$GITHUB_SHA")"
          resolved_release="${RESOLVED_RELEASE:-$RELEASE}"
          requested_release="${REQUESTED_RELEASE:-$RELEASE}"
          tag_name="immortalwrt-${resolved_release}-x86-64-rootfs-${ROOTFS_PARTSIZE}m-${short_sha}"
          release_name="ImmortalWrt ${resolved_release} x86/64 custom rootfs ${ROOTFS_PARTSIZE}M (${short_sha})"

          {
            echo "RELEASE_TAG=${tag_name}"
            echo "RELEASE_NAME=${release_name}"
          } >> "$GITHUB_ENV"

          {
            echo "Custom ImmortalWrt firmware for fu5502."
            echo
            echo "- Requested release: ${requested_release}"
            echo "- Resolved release: ${resolved_release}"
            echo "- Target: x86/64"
            echo "- Profile: generic"
            echo "- Rootfs partsize: ${ROOTFS_PARTSIZE} MB"
            echo "- Homepage API plugin is embedded from the latest fu5502/luci-app-homepage-api default branch"
            echo "- ImageBuilder: ${IMAGEBUILDER_URL}"
            echo "- Upstream plugin refresh: ${BUILD_UPSTREAM_PACKAGES}"
            echo "- Upstream apk repositories are configured in config/upstream-apk-repositories.txt"
            echo "- Upstream release APKs are configured in config/upstream-release-apks.txt"
            echo "- Upstream SDK-built packages are configured in config/upstream-sdk-packages.txt"
            echo
            echo "Upstream packages:"
            if [ -f artifacts/UPSTREAM-PACKAGES.txt ]; then
              sed 's/^/- /' artifacts/UPSTREAM-PACKAGES.txt
            else
              echo "- No upstream package manifest was produced"
            fi
            echo
            echo "Files:"
            for file in artifacts/*; do
              echo "- $(basename "$file")"
            done
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --title "$RELEASE_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
